<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Surprise for My Girl</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- background music -->
    <audio id="bg-music" src="Afusic - Pal Pal with @Talwiinder (Official Visualiser) Prod. @AliSoomroMusic [AbkEmIgJMcU].mp3" loop></audio>

    <div class="greetings">
      <h1 class="name">
        <span style="--i:0">T</span>
        <span style="--i:1">A</span>
        <span style="--i:2">N</span>
        <span style="--i:3">U</span>
        <span style="--i:4">S</span>
        <span style="--i:5">H</span>
        <span style="--i:6">K</span>
        <span style="--i:7">A</span>
      </h1>

      <p class="subtitle">For you my prettiest of all time 🤍</p>

      <a href="#" id="open-btn" class="btn">Open Here</a>
    </div>

    <!-- container that will show the flowers page -->
    <div id="flowers-container" style="display:none; width:100vw; height:100vh;">
      <iframe
        id="flowers-frame"
        src="flowers.html"
        style="border:none; width:100%; height:100%;"
      ></iframe>
    </div>

    <script>
      const btn = document.getElementById("open-btn");
      const audio = document.getElementById("bg-music");
      const greetings = document.querySelector(".greetings");
      const flowersContainer = document.getElementById("flowers-container");

      if (btn && audio && greetings && flowersContainer) {
        btn.addEventListener("click", (e) => {
          e.preventDefault();

          audio.play().catch(() => {
            // if autoplay is blocked, she can click again
          });

          greetings.style.display = "none";
          flowersContainer.style.display = "block";
        });
      }
    </script>
  </body>
</html>
